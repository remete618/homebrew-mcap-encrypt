name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formula:
    name: brew ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@8eb7f2efa6ab636da09aef605b497fd5b8a7587d # master

      - name: brew style
        run: brew style ./Formula/mcap-encrypt.rb

      - name: brew audit (strict, online)
        # GoReleaser always writes an explicit `version "x.y.z"` into the
        # formula. Homebrew 7 flags that as redundant whenever the same
        # version can be read from the download URL, which is always the
        # case here. Skip only that one resource audit (audit_version);
        # every other check, URL, checksum, license, style, still runs.
        run: brew audit --strict --online --except=version remete618/mcap-encrypt/mcap-encrypt

      - name: brew install
        run: brew install --verbose remete618/mcap-encrypt/mcap-encrypt

      - name: brew test
        run: brew test --verbose remete618/mcap-encrypt/mcap-encrypt

      - name: brew uninstall
        run: brew uninstall mcap-encrypt
